<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>سُبحان — مسبحة تفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0B3D3A;
    --deep-2:#0F4A45;
    --panel:#123C39;
    --panel-2:#164944;
    --gold:#C9A227;
    --gold-light:#E8C766;
    --cream:#F4EFDE;
    --cream-dim:#CFC9B4;
    --mint:#7FD9C4;
    --locked:#26433F;
    --danger:#3a1414;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Cairo', sans-serif;
    background: radial-gradient(120% 100% at 50% -10%, #145049 0%, var(--deep) 55%, #082825 100%);
    color:var(--cream);
    overflow:hidden;
    min-height:100vh;
    position:relative;
  }
  /* subtle arabesque backdrop */
  .bg-pattern{
    position:fixed; inset:0; z-index:0; opacity:.06; pointer-events:none;
    background-image:
      repeating-linear-gradient(45deg, var(--gold) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(-45deg, var(--gold) 0 1px, transparent 1px 40px);
  }
  #app{position:relative; z-index:1; height:100vh; display:flex; flex-direction:column;}
  .screen{
    display:none;
    flex:1;
    flex-direction:column;
    padding:18px 18px calc(70px + env(safe-area-inset-bottom, 0px));
    height:100%;
    overflow-y:auto;
    animation: screenIn .35s ease;
  }
  .screen.active{display:flex;}
  @keyframes screenIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  h1,h2,h3{font-family:'Amiri', serif; margin:0;}

  /* ---------- TOP BAR ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:4px 2px 10px;}
  .icon-btn{
    background:var(--panel); border:1px solid rgba(201,162,39,.35); color:var(--gold-light);
    width:40px; height:40px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; user-select:none;
  }
  .icon-btn:active{transform:scale(.92);}

  /* ---------- HOME ---------- */
  .brand{ text-align:center; margin-top:10px; }
  .brand .star{
    width:64px; height:64px; margin:0 auto 8px;
    color:var(--gold);
  }
  .brand h1{font-size:34px; color:var(--gold-light); letter-spacing:1px;}
  .brand p{color:var(--cream-dim); font-size:13px; margin-top:4px;}

  .stats-row{display:flex; gap:12px; margin:26px 0 10px;}
  .stat-card{
    flex:1; background:linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid rgba(201,162,39,.25);
    border-radius:18px; padding:16px 10px; text-align:center;
  }
  .stat-card .num{font-size:24px; font-weight:800; color:var(--gold-light); font-variant-numeric: tabular-nums;}
  .stat-card .lbl{font-size:12px; color:var(--cream-dim); margin-top:4px;}

  .home-actions{margin-top:auto; display:flex; flex-direction:column; gap:12px; padding-top:20px;}
  .btn{
    border:none; border-radius:18px; padding:16px; font-family:'Cairo'; font-weight:800; font-size:17px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg, var(--gold-light), var(--gold)); color:#1c1607; box-shadow:0 8px 22px -6px rgba(201,162,39,.55);}
  .btn-secondary{background:var(--panel-2); color:var(--cream); border:1px solid rgba(201,162,39,.3);}

  /* ---------- FREE TAP GAME ---------- */
  .game-header{display:flex; align-items:center; justify-content:space-between;}
  .score-pill{background:var(--panel); border:1px solid rgba(201,162,39,.3); border-radius:14px; padding:8px 16px; text-align:center;}
  .score-pill .n{font-size:20px; font-weight:800; color:var(--gold-light);}
  .score-pill .l{font-size:10px; color:var(--cream-dim);}

  .tap-zone{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative;}

  .beads-wrap{position:relative; width:min(78vw, 300px); aspect-ratio:1; display:flex; align-items:center; justify-content:center;}
  .bead{
    position:absolute; width:9px; height:9px; border-radius:50%;
    background:var(--panel-2); border:1px solid rgba(201,162,39,.4);
    transition:background .25s, box-shadow .25s, transform .25s;
  }
  .bead.lit{background:var(--gold-light); box-shadow:0 0 8px 2px rgba(232,199,102,.8); transform:scale(1.25);}

  .tap-btn{
    width:64%; height:64%; border-radius:50%; border:none; cursor:pointer;
    background: radial-gradient(circle at 35% 30%, #1a5850, var(--deep-2) 70%);
    box-shadow: 0 0 0 6px rgba(201,162,39,.12), 0 14px 30px -10px rgba(0,0,0,.6), inset 0 0 30px rgba(201,162,39,.15);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    position:relative; overflow:visible;
  }
  .tap-btn:active{transform:scale(.95);}
  .tap-btn .star-icon{width:38%; color:var(--gold); opacity:.85;}
  .tap-btn .hint{position:absolute; bottom:16%; font-size:11px; color:var(--cream-dim); letter-spacing:.5px;}

  .float-word{
    position:absolute; font-family:'Amiri', serif; font-weight:700; color:var(--gold-light);
    font-size:22px; pointer-events:none; white-space:nowrap;
    animation: floatUp 1.1s ease-out forwards;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  @keyframes floatUp{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.6);}
    15%{opacity:1; transform:translate(-50%,-60%) scale(1.05);}
    100%{opacity:0; transform:translate(-50%,-160%) scale(1);}
  }
  .particle{
    position:absolute; width:5px; height:5px; border-radius:50%; background:var(--mint);
    pointer-events:none; animation: pop .7s ease-out forwards;
  }
  @keyframes pop{
    0%{opacity:1; transform:translate(0,0) scale(1);}
    100%{opacity:0; transform:translate(var(--dx), var(--dy)) scale(.3);}
  }
  .lap-flash{
    position:absolute; inset:-6%; border-radius:50%; pointer-events:none;
    box-shadow:0 0 0 0 rgba(232,199,102,.6);
    animation:lapPulse .6s ease-out;
  }
  @keyframes lapPulse{
    0%{box-shadow:0 0 0 0 rgba(232,199,102,.55);}
    100%{box-shadow:0 0 0 26px rgba(232,199,102,0);}
  }
  .shake{animation:shakeAnim .28s;}
  @keyframes shakeAnim{
    0%,100%{transform:translate(0,0);}
    25%{transform:translate(-2px,1px);}
    50%{transform:translate(2px,-1px);}
    75%{transform:translate(-1px,-1px);}
  }

  /* ---------- STAGES GRID ---------- */
  .stages-title{margin:6px 0 16px;}
  .stages-title h2{font-size:22px; color:var(--gold-light);}
  .stages-title p{color:var(--cream-dim); font-size:12px; margin-top:4px;}
  .grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;
    padding-bottom:10px;
  }
  .stage-cell{
    aspect-ratio:1; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid rgba(201,162,39,.25); cursor:pointer; position:relative;
  }
  .stage-cell.locked{background:var(--locked); border-color:rgba(255,255,255,.06); cursor:default;}
  .stage-cell.locked .num{color:#5c7773;}
  .stage-cell.done{border-color:var(--gold); box-shadow:0 0 0 1px rgba(201,162,39,.4), 0 8px 18px -8px rgba(201,162,39,.5);}
  .stage-cell .num{font-size:22px; font-weight:800; color:var(--gold-light);}
  .stage-cell .tgt{font-size:10px; color:var(--cream-dim); margin-top:3px;}
  .stage-cell .check{position:absolute; top:6px; left:8px; font-size:13px; color:var(--gold);}
  .stage-cell .lock-ic{font-size:16px; color:#5c7773;}
  .stage-cell .mini-bar{position:absolute; bottom:8px; left:14%; right:14%; height:4px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden;}
  .stage-cell .mini-bar-fill{height:100%; background:var(--gold-light);}

  /* ---------- CHALLENGE ---------- */
  .challenge-header{text-align:center; margin-bottom:6px;}
  .challenge-header h2{color:var(--gold-light); font-size:22px;}
  .challenge-header p{color:var(--cream-dim); font-size:12px; margin-top:4px;}

  .progress-wrap{margin:14px 0 4px;}
  .progress-bar-bg{background:var(--panel); border-radius:20px; height:16px; overflow:hidden; border:1px solid rgba(201,162,39,.25);}
  .progress-bar-fill{height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-light)); transition:width .25s ease; border-radius:20px;}
  .progress-nums{display:flex; justify-content:space-between; font-size:12px; color:var(--cream-dim); margin-top:6px;}

  /* ---------- CELEBRATION MODAL ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(4,20,18,.75); z-index:50;
    display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .modal-backdrop.show{opacity:1; pointer-events:all;}
  .modal-card{
    background:linear-gradient(165deg, var(--panel-2), var(--panel));
    border:1px solid var(--gold); border-radius:22px; padding:30px 24px; text-align:center; width:min(84vw,320px);
    transform:scale(.85); transition:transform .3s;
  }
  .modal-backdrop.show .modal-card{transform:scale(1);}
  .modal-card .big-star{font-size:44px; margin-bottom:6px;}
  .modal-card h3{color:var(--gold-light); font-size:22px; margin-bottom:6px;}
  .modal-card p{color:var(--cream-dim); font-size:13px; margin-bottom:20px;}

  /* ---------- AD BANNER ---------- */
  .ad-banner{
    position:fixed; bottom:0; left:0; right:0; height:52px; z-index:40;
    background:#0a2825; border-top:1px solid rgba(201,162,39,.2);
    display:flex; align-items:center; justify-content:center;
    color:var(--cream-dim); font-size:11px; letter-spacing:.5px;
  }

  ::-webkit-scrollbar{display:none;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<div class="bg-pattern"></div>
<div id="app">

  <!-- ============ HOME ============ -->
  <section class="screen active" id="screen-home">
    <div class="brand">
      <svg class="star" viewBox="0 0 100 100" fill="currentColor">
        <path d="M50 2 L61 35 L96 35 L68 55 L79 90 L50 70 L21 90 L32 55 L4 35 L39 35 Z"/>
      </svg>
      <h1>سُبحان</h1>
      <p>مسبحتك التفاعلية اليومية</p>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="num" id="home-total">0</div>
        <div class="lbl">إجمالي التسبيحات</div>
      </div>
      <div class="stat-card">
        <div class="num" id="home-best">0</div>
        <div class="lbl">أفضل جلسة</div>
      </div>
    </div>

    <div class="stats-row" style="margin-top:0;">
      <div class="stat-card">
        <div class="num" id="home-stage">1</div>
        <div class="lbl">المرحلة الحالية</div>
      </div>
    </div>

    <div class="home-actions">
      <button class="btn btn-primary" id="btn-start">ابدأ التسبيح</button>
      <button class="btn btn-secondary" id="btn-stages">المراحل والتحديات</button>
    </div>
  </section>

  <!-- ============ FREE TAP ============ -->
  <section class="screen" id="screen-game">
    <div class="game-header">
      <div class="icon-btn" data-nav="home-back">‹</div>
      <div class="score-pill">
        <div class="n" id="game-score">0</div>
        <div class="l">هذه الجلسة</div>
      </div>
      <div class="score-pill">
        <div class="n" id="game-total">0</div>
        <div class="l">الإجمالي</div>
      </div>
    </div>

    <div class="tap-zone" id="game-tap-zone">
      <div class="beads-wrap" id="game-beads-wrap">
        <!-- beads injected by JS -->
        <button class="tap-btn" id="game-tap-btn">
          <svg class="star-icon" viewBox="0 0 100 100" fill="currentColor">
            <path d="M50 2 L61 35 L96 35 L68 55 L79 90 L50 70 L21 90 L32 55 L4 35 L39 35 Z"/>
          </svg>
          <span class="hint">اضغط للتسبيح</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ============ STAGES GRID ============ -->
  <section class="screen" id="screen-stages">
    <div class="topbar">
      <div class="icon-btn" data-nav="home-back">‹</div>
      <div style="width:40px;"></div>
    </div>
    <div class="stages-title">
      <h2>المراحل والتحديات</h2>
      <p>أكمل كل مرحلة لفتح ما بعدها</p>
    </div>
    <div class="grid" id="stages-grid"></div>
  </section>

  <!-- ============ CHALLENGE (single stage) ============ -->
  <section class="screen" id="screen-challenge">
    <div class="game-header">
      <div class="icon-btn" data-nav="stages-back">‹</div>
      <div class="score-pill">
        <div class="n" id="challenge-count">0</div>
        <div class="l">تسبيحات المرحلة</div>
      </div>
      <div style="width:40px;"></div>
    </div>

    <div class="challenge-header">
      <h2 id="challenge-title">المرحلة 1</h2>
      <p id="challenge-sub">الهدف: 100 تسبيحة</p>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="challenge-bar" style="width:0%"></div></div>
      <div class="progress-nums"><span id="challenge-done">0</span><span id="challenge-target">100</span></div>
    </div>

    <div class="tap-zone" id="challenge-tap-zone">
      <div class="beads-wrap" id="challenge-beads-wrap">
        <button class="tap-btn" id="challenge-tap-btn">
          <svg class="star-icon" viewBox="0 0 100 100" fill="currentColor">
            <path d="M50 2 L61 35 L96 35 L68 55 L79 90 L50 70 L21 90 L32 55 L4 35 L39 35 Z"/>
          </svg>
          <span class="hint">اضغط للتسبيح</span>
        </button>
      </div>
    </div>
  </section>

</div>

<!-- Celebration Modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal-card">
    <div class="big-star">🌟</div>
    <h3>أحسنت!</h3>
    <p id="modal-text">أكملت المرحلة بنجاح، تم فتح المرحلة التالية</p>
    <button class="btn btn-primary" id="modal-close" style="width:100%;">متابعة</button>
  </div>
</div>

<!-- Ad banner placeholder: real AdMob rendering requires a native wrapper (see notes) -->
<div class="ad-banner" id="ad-banner">مساحة إعلان بانر — AdMob</div>

<script>
(function(){
  "use strict";

  /* ---------------- STORAGE ---------------- */
  var STORAGE_KEY = "tasbih_app_state_v1";
  var STAGE_TARGETS = [100, 300, 600, 1000, 2000, 3500, 5000, 7500, 10000, 15000];

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(!Array.isArray(parsed.stageProgress) || parsed.stageProgress.length !== STAGE_TARGETS.length){
          parsed.stageProgress = STAGE_TARGETS.map(function(){return 0;});
        }
        return parsed;
      }
    }catch(e){}
    return {
      total: 0,
      bestSession: 0,
      unlockedStage: 0, // index of highest unlocked stage
      stageProgress: STAGE_TARGETS.map(function(){return 0;}),
      stageDone: STAGE_TARGETS.map(function(){return false;})
    };
  }
  var state = loadState();
  if(!Array.isArray(state.stageDone) || state.stageDone.length !== STAGE_TARGETS.length){
    state.stageDone = STAGE_TARGETS.map(function(i, idx){ return state.stageProgress[idx] >= STAGE_TARGETS[idx]; });
  }

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  /* ---------------- NAV ---------------- */
  var screens = {
    home: document.getElementById("screen-home"),
    game: document.getElementById("screen-game"),
    stages: document.getElementById("screen-stages"),
    challenge: document.getElementById("screen-challenge")
  };
  function showScreen(name){
    Object.keys(screens).forEach(function(k){ screens[k].classList.toggle("active", k === name); });
  }

  document.querySelectorAll('[data-nav="home-back"]').forEach(function(el){
    el.addEventListener("click", function(){ showScreen("home"); renderHome(); });
  });
  document.querySelectorAll('[data-nav="stages-back"]').forEach(function(el){
    el.addEventListener("click", function(){ showScreen("stages"); renderStages(); });
  });

  document.getElementById("btn-start").addEventListener("click", function(){
    gameSession = 0;
    document.getElementById("game-score").textContent = 0;
    document.getElementById("game-total").textContent = state.total;
    buildBeads(document.getElementById("game-beads-wrap"), 33);
    updateBeads(document.getElementById("game-beads-wrap"), 0);
    showScreen("game");
  });
  document.getElementById("btn-stages").addEventListener("click", function(){
    showScreen("stages"); renderStages();
  });

  /* ---------------- HOME RENDER ---------------- */
  function renderHome(){
    document.getElementById("home-total").textContent = state.total;
    document.getElementById("home-best").textContent = state.bestSession;
    document.getElementById("home-stage").textContent = Math.min(state.unlockedStage + 1, STAGE_TARGETS.length);
  }
  renderHome();

  /* ---------------- BEADS RING ---------------- */
  function buildBeads(wrap, count){
    // remove old beads (keep the tap button)
    Array.prototype.slice.call(wrap.querySelectorAll(".bead")).forEach(function(b){ b.remove(); });
    var radiusPct = 46;
    for(var i=0;i<count;i++){
      var angle = (i / count) * Math.PI * 2 - Math.PI/2;
      var x = 50 + radiusPct * Math.cos(angle);
      var y = 50 + radiusPct * Math.sin(angle);
      var bead = document.createElement("div");
      bead.className = "bead";
      bead.style.left = x + "%";
      bead.style.top = y + "%";
      bead.style.transform = "translate(-50%,-50%)";
      bead.dataset.index = i;
      wrap.appendChild(bead);
    }
  }
  function updateBeads(wrap, litCount){
    var beads = wrap.querySelectorAll(".bead");
    var lapPos = litCount % beads.length;
    beads.forEach(function(b, i){
      b.classList.toggle("lit", i < lapPos || (litCount > 0 && lapPos === 0 && litCount % beads.length === 0));
    });
  }

  function spawnFloatWord(container, x, y){
    var el = document.createElement("div");
    el.className = "float-word";
    el.textContent = "سبحان الله";
    el.style.left = x + "px";
    el.style.top = y + "px";
    container.appendChild(el);
    setTimeout(function(){ el.remove(); }, 1150);
  }
  function spawnParticles(container, x, y){
    for(var i=0;i<8;i++){
      var p = document.createElement("div");
      p.className = "particle";
      var angle = Math.random() * Math.PI * 2;
      var dist = 30 + Math.random()*30;
      p.style.setProperty("--dx", (Math.cos(angle)*dist)+"px");
      p.style.setProperty("--dy", (Math.sin(angle)*dist)+"px");
      p.style.left = x + "px";
      p.style.top = y + "px";
      container.appendChild(p);
      (function(el){ setTimeout(function(){ el.remove(); }, 720); })(p);
    }
  }
  function flashLap(wrap){
    var fl = document.createElement("div");
    fl.className = "lap-flash";
    wrap.appendChild(fl);
    setTimeout(function(){ fl.remove(); }, 650);
  }
  // subtle click sound using WebAudio (no external file needed)
  var audioCtx = null;
  function playClick(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(700, audioCtx.currentTime);
      g.gain.setValueAtTime(0.06, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.12);
    }catch(e){}
  }

  /* ---------------- FREE TAP GAME ---------------- */
  var gameSession = 0;
  var gameZone = document.getElementById("game-tap-zone");
  var gameBtn = document.getElementById("game-tap-btn");
  var gameBeadsWrap = document.getElementById("game-beads-wrap");

  gameBtn.addEventL
